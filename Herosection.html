<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suno Watch Cloth</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

.hero {
    background:
    linear-gradient(90deg, rgba(0,0,0,.8), transparent),
    url('https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=1800')
    center/cover no-repeat;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 8%;
}

.logo {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 3px;
}

.logo span {
    color: #d6a85c;
}

nav ul {
    display: flex;
    gap: 35px;
    list-style: none;
}

nav a {
    text-decoration: none;
    color: white;
    font-size: 14px;
    transition: .3s;
}

nav a:hover {
    color: #d6a85c;
}

.hero-content {
    padding: 150px 8% 100px;
    max-width: 750px;
}

.tag {
    color: #d6a85c;
    letter-spacing: 5px;
    font-size: 13px;
    margin-bottom: 25px;
}

h1 {
    font-size: clamp(45px, 7vw, 85px);
    line-height: 1.05;
    margin-bottom: 25px;
    text-transform: uppercase;
}

h1 span {
    color: #d6a85c;
}

.hero-content p {
    color: #ddd;
    font-size: 17px;
    line-height: 1.8;
    max-width: 480px;
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    gap: 15px;
}

.btn {
    padding: 16px 32px;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    transition: .3s;
}

.primary {
    background: #d6a85c;
    color: #111;
}

.primary:hover {
    background: white;
}

.secondary {
    border: 1px solid white;
    color: white;
}

.secondary:hover {
    background: white;
    color: black;
}

@media(max-width: 768px) {
    nav {
        padding: 22px 5%;
    }

    nav ul {
        display: none;
    }

    .hero-content {
        padding: 160px 7% 80px;
    }

    .hero-content p {
        font-size: 15px;
    }

    .buttons {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<section class="hero">

<nav>
    <div class="logo">SUNO<span>.</span></div>

    <ul>
        <li><a href="#">HOME</a></li>
        <li><a href="#">COLLECTION</a></li>
        <li><a href="#">ABOUT</a></li>
        <li><a href="#">CONTACT</a></li>
    </ul>
</nav>

<div class="hero-content">

    <div class="tag">PREMIUM FASHION COLLECTION</div>

    <h1>
        STYLE THAT<br>
        SPEAKS <span>YOU.</span>
    </h1>

    <p>
        Discover premium clothing designed for confidence,
        comfort and timeless style. Make every moment fashionable.
    </p>

    <div class="buttons">
        <a href="#collection" class="btn primary">
            SHOP NOW →
        </a>

        <a href="#about" class="btn secondary">
            EXPLORE MORE
        </a>
    </div>

</div>
</section>

</body>
</html>
