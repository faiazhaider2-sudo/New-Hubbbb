    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lect.fld{padding-right:30px;cursor:pointer;-webkit-appearance:none;appearance:none}\ntextarea.fld{border:1px solid #8C8168;padding:14px 16px;min-height:160px;resize:vertical;line-height:1.6}\ntextarea.fld:focus{border-color:#34332f;box-shadow:0 0 0 1px #34332f}\ninput[type=radio],input[type=checkbox]{accent-color:#34332f;width:18px;height:18px;margin:0;flex:0 0 auto}\n.btn{cursor:pointer;background:#34332f;color:#FFFFFF;border:1px solid #34332f;padding:19px 44px;font:500 14px/1 'EB Garamond',Georgia,serif;letter-spacing:.26em;text-transform:uppercase;min-height:56px}\n.btn:hover{background:#4d4b44;border-color:#4d4b44}\n.btn:focus-visible{outline:2px solid #b3a283;outline-offset:4px}\n.btn2{cursor:pointer;background:transparent;color:#34332f;border:1px solid #34332f;padding:17px 36px;font:500 14px/1 'EB Garamond',Georgia,serif;letter-spacing:.26em;text-transform:uppercase;min-height:52px}\n.btn2:hover{background:#34332f;color:#FFFFFF}\n.btn2:focus-visible{outline:2px solid #b3a283;outline-offset:4px}\n.flink{color:#D8D0BC;text-decoration:none}\n.flink:hover{color:#e9dcc8;text-decoration:underline}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: #FFFFFF; color: #2A2722; font-family: 'EB Garamond', Georgia, serif; font-size: 18px; line-height: 1.6\" data-canvas-width=\"1360\" data-canvas-height=\"2040\" data-document-role=\"page\" data-label=\"Contact\">\n\n  <!-- Masthead -->\n  <header style=\"padding: 40px clamp(20px, 5vw, 64px) 0; display: flex; flex-direction: column; align-items: center; gap: 22px; border-bottom: 3px double #cdbf9f\">\n    <a href=\"#top\" style=\"text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 8px\">\n      <span style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(26px, 4.4vw, 38px); letter-spacing: .3em; color: #34332f; text-transform: uppercase; padding-left: .3em; text-align: center; line-height: 1.1\">Ashworth &amp; Vane<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: .42em; text-transform: uppercase; color: #6b6250; padding-left: .42em\">Fine Watchmakers<\u002Fspan>\n    <\u002Fa>\n    <nav aria-label=\"Primary\" style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 4px clamp(20px, 3.4vw, 48px)\">\n      <a class=\"navlink\" href=\"#collections\">Collections<\u002Fa>\n      <a class=\"navlink\" href=\"#heritage\">Heritage<\u002Fa>\n      <a class=\"navlink\" href=\"#servicing\">Servicing<\u002Fa>\n      <a class=\"navlink\" href=\"#salon\">The Salon<\u002Fa>\n      <a class=\"navlink\" href=\"#top\" aria-current=\"page\" style=\"color: #34332f; border-bottom-color: #b3a283\">Contact<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- Hero -->\n  <section id=\"top\" style=\"background: #34332f; padding: clamp(56px, 8vw, 96px) clamp(20px, 5vw, 64px)\">\n    <div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 48px\">\n      <div style=\"flex: 1 1 460px; min-width: 0\">\n        <div style=\"font-size: 14px; letter-spacing: .34em; text-transform: uppercase; color: #e9dcc8\">Correspondence<\u002Fdiv>\n        <h1 style=\"margin: 22px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(46px, 7.2vw, 92px); line-height: 1.02; color: #FFFFFF; letter-spacing: -.005em\">Contact the <em style=\"font-style: italic; font-weight: 400; color: #e9dcc8\">House<\u002Fem><\u002Fh1>\n        <div style=\"width: 72px; height: 1px; background: #e9dcc8; margin: 34px 0 30px\"><\u002Fdiv>\n        <p style=\"margin: 0; max-width: 520px; font-size: 20px; line-height: 1.7; color: #D8D0BC\">Whether you are considering your first timepiece, completing a collection, or entrusting us with a cherished heirloom, we welcome your letter. Each enquiry is answered personally by a member of our client relations team.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 0 1 340px; width: 100%; display: flex; justify-content: center\">\n        <svg sc-camel-view-box=\"0 0 400 400\" role=\"img\" aria-label=\"Illustration of a classic watch dial with Roman numerals\" style=\"width: 100%; max-width: 340px; height: auto\">\n          <circle cx=\"200\" cy=\"200\" r=\"192\" fill=\"none\" stroke=\"#e9dcc8\" stroke-width=\"1.5\"><\u002Fcircle>\n          <circle cx=\"200\" cy=\"200\" r=\"185\" fill=\"none\" stroke=\"#e9dcc8\" stroke-width=\".6\"><\u002Fcircle>\n          <circle cx=\"200\" cy=\"200\" r=\"176\" fill=\"#3f3e39\" stroke=\"none\"><\u002Fcircle>\n          <circle cx=\"200\" cy=\"200\" r=\"170\" fill=\"none\" stroke=\"#e9dcc8\" stroke-width=\"7\" stroke-dasharray=\"1.2 16.6\" stroke-dashoffset=\"0.6\" transform=\"rotate(-90 200 200)\" opacity=\".75\"><\u002Fcircle>\n          <circle cx=\"200\" cy=\"200\" r=\"163\" fill=\"none\" stroke=\"#e9dcc8\" stroke-width=\"16\" stroke-dasharray=\"3 80.78\" stroke-dashoffset=\"1.5\" transform=\"rotate(-90 200 200)\"><\u002Fcircle>\n          <text x=\"200\" y=\"102\" text-anchor=\"middle\" font-family=\"'Cormorant Garamond', Georgia, serif\" font-size=\"34\" font-weight=\"500\" fill=\"#e9dcc8\">XII<\u002Ftext>\n          <text x=\"302\" y=\"212\" text-anchor=\"middle\" font-family=\"'Cormorant Garamond', Georgia, serif\" font-size=\"34\" font-weight=\"500\" fill=\"#e9dcc8\">III<\u002Ftext>\n          <text x=\"200\" y=\"322\" text-anchor=\"middle\" font-family=\"'Cormorant Garamond', Georgia, serif\" font-size=\"34\" font-weight=\"500\" fill=\"#e9dcc8\">VI<\u002Ftext>\n          <text x=\"98\" y=\"212\" text-anchor=\"middle\" font-family=\"'Cormorant Garamond', Georgia, serif\" font-size=\"34\" font-weight=\"500\" fill=\"#e9dcc8\">IX<\u002Ftext>\n          <text x=\"200\" y=\"160\" text-anchor=\"middle\" font-family=\"'Cormorant Garamond', Georgia, serif\" font-size=\"13\" letter-spacing=\"4\" fill=\"#e9dcc8\">ASHWORTH &amp; VANE<\u002Ftext>\n          <line x1=\"200\" y1=\"200\" x2=\"134.5\" y2=\"154\" stroke=\"#FFFFFF\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fline>\n          <line x1=\"200\" y1=\"200\" x2=\"304\" y2=\"140\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\"><\u002Fline>\n          <line x1=\"200\" y1=\"178\" x2=\"200\" y2=\"262\" stroke=\"#e9dcc8\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fline>\n          <circle cx=\"200\" cy=\"200\" r=\"8\" fill=\"#e9dcc8\"><\u002Fcircle>\n          <circle cx=\"200\" cy=\"200\" r=\"3\" fill=\"#34332f\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Body -->\n  <main style=\"padding: clamp(56px, 8vw, 104px) clamp(20px, 5vw, 64px)\">\n    <div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 72px; align-items: flex-start\">\n\n      <!-- Form column -->\n      <section aria-labelledby=\"form-h\" style=\"flex: 999 1 560px; min-width: 0\">\n        <div style=\"font-size: 14px; letter-spacing: .34em; text-transform: uppercase; color: #6b6250\">Write to us<\u002Fdiv>\n        <h2 id=\"form-h\" style=\"margin: 14px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(34px, 4.6vw, 52px); line-height: 1.08; color: #34332f\">A Letter of Enquiry<\u002Fh2>\n        <div style=\"width: 56px; height: 1px; background: #b3a283; margin: 26px 0 24px\"><\u002Fdiv>\n\n        <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"margin: 0 0 40px; max-width: 560px; color: #4A453B\">Please share a few details and we shall reply by your preferred means. Fields marked with an asterisk are required.<\u002Fp>\n\n        <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display: flex; flex-direction: column; gap: 34px\">\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 30px\">\n            <div style=\"flex: 1 1 130px; min-width: 0; position: relative\">\n              <label class=\"lbl\" for=\"f-title\">Title<\u002Flabel>\n              <sc-raw-select class=\"fld\" id=\"f-title\" name=\"title\">\n                <option value=\"\">None<\u002Foption>\n                <option>Mr.<\u002Foption>\n                <option>Mrs.<\u002Foption>\n                <option>Ms.<\u002Foption>\n                <option>Dr.<\u002Foption>\n                <option>Lord / Lady<\u002Foption>\n              <\u002Fsc-raw-select>\n              <svg aria-hidden=\"true\" width=\"12\" height=\"8\" sc-camel-view-box=\"0 0 12 8\" style=\"position: absolute; right: 4px; bottom: 21px; pointer-events: none\"><path d=\"M1 1.5l5 5 5-5\" fill=\"none\" stroke=\"#34332f\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"flex: 2 1 220px; min-width: 0\">\n              <label class=\"lbl\" for=\"f-first\">First name *<\u002Flabel>\n              <input class=\"fld\" id=\"f-first\" name=\"first\" type=\"text\" autocomplete=\"given-name\" required=\"\">\n            <\u002Fdiv>\n            <div style=\"flex: 2 1 220px; min-width: 0\">\n              <label class=\"lbl\" for=\"f-last\">Surname *<\u002Flabel>\n              <input class=\"fld\" id=\"f-last\" name=\"last\" type=\"text\" autocomplete=\"family-name\" required=\"\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 30px\">\n            <div style=\"flex: 1 1 240px; min-width: 0\">\n              <label class=\"lbl\" for=\"f-email\">Email address *<\u002Flabel>\n              <input class=\"fld\" id=\"f-email\" name=\"email\" type=\"email\" autocomplete=\"email\" required=\"\">\n            <\u002Fdiv>\n            <div style=\"flex: 1 1 240px; min-width: 0\">\n              <label class=\"lbl\" for=\"f-tel\">Telephone<\u002Flabel>\n              <input class=\"fld\" id=\"f-tel\" name=\"tel\" type=\"tel\" autocomplete=\"tel\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 30px\">\n            <div style=\"flex: 1 1 240px; min-width: 0; position: relative\">\n              <label class=\"lbl\" for=\"f-nature\">Nature of enquiry *<\u002Flabel>\n              <sc-raw-select class=\"fld\" id=\"f-nature\" name=\"nature\" required=\"\">\n                <option value=\"\">Please select<\u002Foption>\n                <option>Acquiring a timepiece<\u002Foption>\n                <option>Servicing &amp; restoration<\u002Foption>\n                <option>Private appointment at the salon<\u002Foption>\n                <option>Valuation or part-exchange<\u002Foption>\n                <option>Press &amp; partnerships<\u002Foption>\n                <option>Another matter<\u002Foption>\n              <\u002Fsc-raw-select>\n              <svg aria-hidden=\"true\" width=\"12\" height=\"8\" sc-camel-view-box=\"0 0 12 8\" style=\"position: absolute; right: 4px; bottom: 21px; pointer-events: none\"><path d=\"M1 1.5l5 5 5-5\" fill=\"none\" stroke=\"#34332f\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"flex: 1 1 240px; min-width: 0; position: relative\">\n              <label class=\"lbl\" for=\"f-coll\">Collection of interest<\u002Flabel>\n              <sc-raw-select class=\"fld\" id=\"f-coll\" name=\"collection\">\n                <option value=\"\">No preference<\u002Foption>\n                <option>Dress watches<\u002Foption>\n                <option>Sport &amp; field watches<\u002Foption>\n                <option>Complications<\u002Foption>\n                <option>Ladies' timepieces<\u002Foption>\n                <option>Pre-owned &amp; vintage<\u002Foption>\n              <\u002Fsc-raw-select>\n              <svg aria-hidden=\"true\" width=\"12\" height=\"8\" sc-camel-view-box=\"0 0 12 8\" style=\"position: absolute; right: 4px; bottom: 21px; pointer-events: none\"><path d=\"M1 1.5l5 5 5-5\" fill=\"none\" stroke=\"#34332f\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <label class=\"lbl\" for=\"f-ref\">Reference or serial number, if applicable<\u002Flabel>\n            <input class=\"fld\" id=\"f-ref\" name=\"reference\" type=\"text\" autocomplete=\"off\">\n          <\u002Fdiv>\n\n          <div>\n            <label class=\"lbl\" for=\"f-msg\" style=\"margin-bottom: 12px\">Your message *<\u002Flabel>\n            <textarea class=\"fld\" id=\"f-msg\" name=\"message\" rows=\"6\" required=\"\"><\u002Ftextarea>\n          <\u002Fdiv>\n\n          <fieldset style=\"border: 0; margin: 0; padding: 0; min-width: 0\">\n            <legend class=\"lbl\" style=\"padding: 0; margin-bottom: 6px\">Preferred reply by<\u002Flegend>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 4px 36px\">\n              <label style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer\"><input type=\"radio\" name=\"reply\" value=\"email\" checked=\"\"> Email<\u002Flabel>\n              <label style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer\"><input type=\"radio\" name=\"reply\" value=\"telephone\"> Telephone<\u002Flabel>\n              <label style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer\"><input type=\"radio\" name=\"reply\" value=\"letter\"> Post<\u002Flabel>\n            <\u002Fdiv>\n          <\u002Ffieldset>\n\n          <label style=\"display: flex; align-items: flex-start; gap: 14px; cursor: pointer; max-width: 600px; color: #4A453B; font-size: 17px; line-height: 1.55; padding: 8px 0\">\n            <input type=\"checkbox\" name=\"consent\" required=\"\" style=\"margin-top: 4px\">\n            <span>I agree that Ashworth &amp; Vane may contact me regarding this enquiry. My details will be used for no other purpose.<\u002Fspan>\n          <\u002Flabel>\n\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 20px 32px; padding-top: 6px\">\n            <button class=\"btn\" type=\"submit\">Send Correspondence<\u002Fbutton>\n            <span style=\"font-size: 16px; font-style: italic; color: #5C564B\">With our compliments.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fform>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"status\" style=\"border: 1px solid #34332f; padding: 6px; max-width: 640px\">\n          <div style=\"border: 1px solid #C9B98F; padding: clamp(32px, 6vw, 56px) clamp(24px, 5vw, 48px); text-align: center; background: #faf7f0\">\n            <svg aria-hidden=\"true\" width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 44 44\" style=\"margin-bottom: 18px\"><circle cx=\"22\" cy=\"22\" r=\"20\" fill=\"none\" stroke=\"#b3a283\" stroke-width=\"1.2\"><\u002Fcircle><path d=\"M13 23l6 6 12-13\" fill=\"none\" stroke=\"#34332f\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <h3 style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1.1; color: #34332f\">Your letter has been received<\u002Fh3>\n            <div style=\"width: 48px; height: 1px; background: #b3a283; margin: 22px auto\"><\u002Fdiv>\n            <p style=\"margin: 0 auto 30px; max-width: 420px; color: #4A453B\">Thank you for writing to Ashworth &amp; Vane. A member of our client relations team will reply to you personally by your preferred means.<\u002Fp>\n            <button class=\"btn2\" type=\"button\" sc-camel-on-click=\"{{ again }}\">Write another letter<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <!-- Sidebar -->\n      <aside id=\"salon\" aria-label=\"Salon details\" style=\"flex: 1 1 340px; min-width: 0; max-width: 460px\">\n        <div style=\"border: 1px solid #34332f; padding: 6px\">\n          <div style=\"border: 1px solid #C9B98F; padding: 40px 36px; background: #faf7f0; display: flex; flex-direction: column; gap: 30px\">\n\n            <div>\n              <div style=\"font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: #6b6250\">Visit<\u002Fdiv>\n              <h3 style=\"margin: 10px 0 14px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 34px; line-height: 1.1; color: #34332f\">The Salon<\u002Fh3>\n              <p style=\"margin: 0; color: #4A453B\">[Street address]<br>[City, Postcode]<\u002Fp>\n              <p style=\"margin: 14px 0 0; color: #4A453B\">Viewings are by private appointment, Monday to Saturday.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"height: 1px; background: #C9B98F\"><\u002Fdiv>\n\n            <div>\n              <div style=\"font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: #6b6250\">Client Relations<\u002Fdiv>\n              <p style=\"margin: 12px 0 0; color: #4A453B\">[Telephone number]<br><a href=\"#top\" style=\"color: #34332f\">[Email address]<\u002Fa><\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"height: 1px; background: #C9B98F\"><\u002Fdiv>\n\n            <div id=\"servicing\">\n              <div style=\"font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: #6b6250\">Servicing &amp; Repairs<\u002Fdiv>\n              <p style=\"margin: 12px 0 0; color: #4A453B\">Please quote your watch's reference or serial number so that our atelier may prepare in advance of your visit.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"height: 1px; background: #C9B98F\"><\u002Fdiv>\n\n            <div>\n              <div style=\"font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: #6b6250\">Press &amp; Partnerships<\u002Fdiv>\n              <p style=\"margin: 12px 0 0; color: #4A453B\"><a href=\"#top\" style=\"color: #34332f\">[Press email address]<\u002Fa><\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n xt/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:2040}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const s = this.state || {};\n    const done = s.submitted === true;\n    return {\n      submitted: done,\n      notSubmitted: !done,\n      onSubmit: (e) => {\n        if (e && e.preventDefault) e.preventDefault();\n        this.setState({ submitted: true });\n      },\n      again: () => this.setState({ submitted: false })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
